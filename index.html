<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredit Portalı</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ümumi Kart Stili */
        .card {
            position: relative;
            width: 380px;
            padding: 40px 30px;
            background: #0d0d0d;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
            transition: all 0.5s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #00ff66);
            animation: rotateBorder 4s linear infinite;
            z-index: 1;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: #0d0d0d;
            border-radius: 13px;
            z-index: 1;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            letter-spacing: 1px;
            font-size: 22px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #181818;
            border: 1px solid #00ff6644;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        input::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff66;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        button:hover {
            background: #00cc52;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }

        .footer-links a {
            color: #00ff66;
            text-decoration: none;
        }

        /* Kredit Təklifləri Səhifəsi üçün üslublar */
        .hidden {
            display: none !important;
        }

        .offer-item {
            background: #181818;
            border: 1px solid #00ff6644;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .offer-item strong {
            color: #00ff66;
        }

        /* Qırmızı Animasiyalı Xəbərdarlıq Bloku */
        .warning-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff0033;
            border-radius: 8px;
            color: #ff3355;
            text-align: center;
            animation: pulseWarning 1.5s infinite alternate, fadeIn 0.5s ease-in-out;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
        }

        .warning-box h3 {
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .warning-box p {
            font-size: 11px;
            line-height: 1.3;
            color: #ffcccc;
        }

        @keyframes pulseWarning {
            0% {
                border-color: #ff0033;
                box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
            }
            100% {
                border-color: #ff5577;
                box-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- GİRİŞ HİSSƏSİ -->
<div id="loginCard" class="card">
    <div class="card-content">
        <h2>KREDİT PORTALI</h2>
        <p class="subtitle">Sürətli və sərfəli kredit üçün daxil olun</p>

        <div class="input-group">
            <input type="text" placeholder="FİN kod və ya İstifadəçi adı" id="username">
        </div>

        <div class="input-group">
            <input type="password" placeholder="Şifrə" id="password">
        </div>

        <button onclick="handleLogin()">Kreditə müraciət et</button>

        <div class="footer-links">
            <a href="#">Şifrəni unutmusunuz?</a>
        </div>
    </div>
</div>

<!-- QEYDİYYATDAN SONRAKİ TƏKLİFLƏR SƏHİFƏSİ (İlkin olaraq gizlidir) -->
<div id="offersCard" class="card hidden" style="width: 420px;">
    <div class="card-content">
        <h2>SİZİN ÜÇÜN TƏKLİFLƏR</h2>
        <p class="subtitle">Uğurla daxil olundu</p>

        <div class="offer-item">
            <strong>Sürətli Nağd Kredit:</strong> 10,000 ₼-dək (12% faizlə)
        </div>
        <div class="offer-item">
            <strong>Kart Kredit xətti:</strong> 3,000 ₼-dək güzəşt müddəti
        </div>

        <!-- Qırmızı Animasiyalı Xəbərdarlıq -->
        <div class="warning-box">
            <h3>⚠️ DİQQƏT!</h3>
            <p>Bu bir phishing simulyasiyasıdır. Şübhəli linklərə keçid etməyin!</p>
        </div>
    </div>
</div>

<script>
function handleLogin() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if(!username || !password) {
        alert("Zəhmət olmasa bütün xanaları doldurun!");
        return;
    }

    // Giriş kartını gizlədirik, təkliflər kartını açırıq
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("offersCard").classList.remove("hidden");
}
</script>

</body>
</html>
